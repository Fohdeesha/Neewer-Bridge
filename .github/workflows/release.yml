# Build and publish release binaries whenever a version tag (vX.Y.Z) is pushed.
# Release procedure: bump `version` in Cargo.toml, add a CHANGELOG entry, commit,
# tag vX.Y.Z, push the tag — this workflow does the rest (test, build, package,
# publish). `workflow_dispatch` allows re-running it for an existing tag.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and release (e.g. v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest still-supported Ubuntu runner => widest glibc compatibility
          # for the shipped binary. Bump when GitHub retires the image.
          - os: ubuntu-22.04
            label: linux-x64
          - os: windows-latest
            label: windows-x64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      # btleplug's Linux backend talks to BlueZ over D-Bus. dpkg-dev provides
      # dpkg-shlibdeps, which works out the .deb's library dependencies.
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config zip dpkg-dev

      # Pinned, so a cargo-deb release can't change the package under us.
      - name: Install cargo-deb
        if: runner.os == 'Linux'
        run: cargo install cargo-deb --locked --version 3.8.0

      - name: Check tag matches Cargo.toml version
        shell: bash
        run: |
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$v" != "$TAG" ]; then
            echo "Cargo.toml version v$v does not match tag $TAG" >&2
            exit 1
          fi

      - name: Test
        run: cargo test --release --locked

      - name: Build
        run: cargo build --release --locked

      # The zips are self-contained: the binary, the commented
      # config.example.toml template, and the license. The example is
      # deliberately NOT named config.toml — that is the live file the bridge
      # reads, so shipping it would let an unzip-over-the-old-install wipe the
      # user's settings. models.toml is compiled into the binary and doesn't
      # need to ship.
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir stage
          cp target/release/neewer-bridge config.example.toml LICENSE stage/
          cd stage && zip "../neewer-bridge-$TAG-linux-x64.zip" ./*

      # The Debian package ([package.metadata.deb] in Cargo.toml), from the
      # binary built and tested above. A second revision of the same build is
      # made too, only so the install test can run a real version upgrade.
      # cargo-deb clears target/debian when it builds, hence the copies.
      - name: Package (Debian)
        if: runner.os == 'Linux'
        run: |
          cargo deb --no-build
          mkdir -p deb-test/upgrade
          cp target/debian/neewer-bridge_*.deb .
          cp neewer-bridge_*.deb deb-test/
          cargo deb --no-build --deb-revision 2 -o deb-test/upgrade/

      # On this runner's real systemd and dpkg: install, service start, journal,
      # SIGTERM, config errors, crash restart, upgrade, remove, purge. Nothing
      # is published unless it passes.
      - name: Install-test the Debian package
        if: runner.os == 'Linux'
        run: sudo sh packaging/test-deb.sh deb-test/neewer-bridge_*.deb deb-test/upgrade/neewer-bridge_*.deb

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory stage | Out-Null
          Copy-Item target/release/neewer-bridge.exe, config.example.toml, LICENSE stage/
          Compress-Archive -Path stage/* -DestinationPath "neewer-bridge-$env:TAG-windows-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: |
            neewer-bridge-*.zip
            neewer-bridge_*.deb
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Use the tag's CHANGELOG section as the release notes.
      - name: Extract release notes from CHANGELOG
        shell: bash
        run: |
          ver="${TAG#v}"
          awk -v ver="$ver" '
            $0 ~ "^## \\[" ver "\\]" {found=1; next}
            found && /^## \[/ {exit}
            found {print}
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/master/CHANGELOG.md)." > notes.md
          fi

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # The Linux job must have produced the package; never publish
          # without it.
          ls dist/neewer-bridge_*_amd64.deb >/dev/null
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.zip dist/*.deb --clobber --repo "${{ github.repository }}"
          else
            gh release create "$TAG" dist/*.zip dist/*.deb \
              --repo "${{ github.repository }}" \
              --title "Neewer-Bridge $TAG" \
              --verify-tag \
              --notes-file notes.md
          fi
