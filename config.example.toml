# Neewer-Bridge configuration example.
# Copy to `neewer-bridge.toml` and edit. Lights are bound by MAC address, so the
# DMX-channel -> physical-light mapping is identical on every boot regardless of
# power-on or discovery order.

[artnet]
# Local IP to receive ArtNet on. 0.0.0.0 = listen on all interfaces.
bind_ip = "0.0.0.0"
# UDP port to listen on. 6454 is the ArtNet standard; change only if needed.
port = 6454

[ble]
# Which Bluetooth adapter to use. "default" = first adapter. You can also give an
# index ("0", "1", ...) or a substring of the adapter name. Run `neewer-bridge
# adapters` to list what's available on this machine.
adapter    = "default"
flush_hz   = 15          # max BLE state updates per light per second (coalescing cap)
probe_secs = 20          # liveness GATT-probe interval, seconds (stale-session detection)

[failsafe]
# What lights do when ArtNet data stops arriving.
#   hold     = keep last state forever (Neewer lights hold their setting)
#   blackout = after timeout, set brightness to 0 (light stays powered/connected)
#   poweroff = after timeout, send BLE power-off
mode         = "hold"
timeout_secs = 0         # 0 = never act (hold); >0 = act after N seconds of silence

[logging]
# Log verbosity + destinations. Console and file are independent — enable either,
# both, or neither. Activity (connects, reconnects, power on/off, failsafe) logs at
# `info`; every BLE command sent to a light logs at `debug`.
# Level precedence: RUST_LOG env var > -v/-vv CLI flags > these settings.
level         = "info"    # trace | debug | info | warn | error (global default)
console       = true      # log to the console (stderr; stdout stays clean for --json)
# console_level = "info"  # optional per-console override (defaults to `level`)
# file          = "neewer-bridge.log"  # path; omit/empty = no file logging
# file_level    = "debug" # optional per-file override — keep a full debug record
                          # on disk while the console stays at info
max_size_mb   = 10        # rotate the log file once it passes this size
max_files     = 5         # how many rotated files to keep (older are deleted)

# --- Lights -----------------------------------------------------------------
# Easiest: run `neewer-bridge add` (interactive) or `add --mac <MAC> --universe N
# --address N`. It identifies the light's model from its BLE name and fills in
# driver / profile / cct_min / cct_max automatically (see `neewer-bridge models`),
# then writes a complete [[lights]] block here. The block below shows the fields.

[[lights]]
mac      = "AA:BB:CC:DD:EE:FF"  # binding identity (required)
name     = "Key light"          # optional label
driver   = "auto"               # auto | classic | infinity | home
profile  = "advanced"           # cct | cct_gm | hsi | full | advanced (NOTES.md §8.1)
                                # `advanced` (10ch) = mode-channel: CCT/HSI/RGBCW/XY/FX
universe = 0                    # ArtNet 15-bit Port-Address (Net/Sub-Net/Universe)
address  = 1                    # 1-based DMX start channel
power_on_connect = true
# CCT scaling range, raw x100K (25 = 2500K, 100 = 10000K). Per-model — check the
# manual. Default 32..56 (3200..5600K); e.g. the TL120C is 25..100 (2500..10000K).
cct_min  = 32
cct_max  = 56

# [[lights]]
# mac      = "11:22:33:44:55:66"
# name     = "Back light"
# driver   = "auto"
# profile  = "cct_gm"
# universe = 0
# address  = 8
