# Neewer-Bridge example configuration.
#
# This file is a TEMPLATE — the bridge never reads it. Copy (or rename) it to
# `config.toml` next to the binary and edit that copy:
#
#   Linux:    cp config.example.toml config.toml
#   Windows:  copy config.example.toml config.toml
#
# Keeping the example separate means unzipping a new release over an existing
# install can't overwrite your settings. `neewer-bridge add` also creates
# `config.toml` from this file automatically the first time you add a light, so
# you can skip the copy if you start there.
#
# Launching `neewer-bridge` with no --config looks for `config.toml` beside the
# executable first, then in the working directory (a bare `neewer-bridge` with
# no subcommand runs the bridge). Lights are bound by MAC address, so the
# DMX-channel -> physical-light mapping is identical on every boot regardless of
# power-on or discovery order.

[artnet]
# Local IP to receive ArtNet on. 0.0.0.0 = listen on all interfaces.
bind_ip = "0.0.0.0"
# UDP port to listen on. 6454 is the ArtNet standard; change only if needed.
port = 6454
# --- Multiple DMX sources (optional) ---------------------------------------
# The bridge can listen on EXTRA ports and/or different bind IPs and merge the
# streams per channel (see README "Multiple DMX sources & merging"). With a
# single input these settings are inactive and nothing changes.
#   merge: htp = highest value wins | lowest = lowest wins | ltp = the source
#   that most recently CHANGED a channel owns it (re-streaming the same data
#   never steals an override back — last changed, not last received).
merge = "ltp"
# Drop a source from the merge after this many seconds of silence — its
# channels fall back to the remaining sources (a disconnected console's
# overrides expire on their own). 0 = never drop.
merge_timeout_secs = 10
# Each [[artnet.inputs]] block adds another listener (the bind_ip/port above is
# always input 0, labelled "primary" in logs). Up to 8 listeners total; each
# needs its own name, and its own port and/or bind_ip.
# GIVE EVERY SOURCE ITS OWN INPUT BLOCK: merging works per input, not per
# sender, so two sources aimed at the same port share one lane and the merge
# can no longer tell them apart. The bridge warns when it sees this happen.
# [[artnet.inputs]]
# name    = "console"   # optional label used in logs
# bind_ip = "0.0.0.0"
# port    = 6455

[ble]
# Which Bluetooth adapter to use. "default" = first adapter. You can also give an
# index ("0", "1", ...) or a substring of the adapter name. Run `neewer-bridge
# adapters` to list what's available on this machine.
adapter     = "default"
flush_hz    = 15         # max BLE state updates per light per second (coalescing cap)
probe_secs  = 20         # how often (s) to run the cheap GATT-read connection check
                         # (3 consecutive misses recycle the link) + read status telemetry
# Discovery scanning is on-demand, not permanent: the bridge scans only while a light
# is disconnected, in duty-cycled bursts, and NOT AT ALL once every light is connected.
# A continuous scan starves the active connections on cheap USB BT dongles (kernel
# "LE Set Scan Enable" timeouts); this keeps the radio free for the links.
scan_window_secs = 8     # length of each discovery burst (s) while a light is missing
scan_pause_secs  = 15    # idle gap between bursts (s) so a powered-off/flaky light is
                         # polled periodically, never scanned constantly. 0 = scan
                         # continuously while something's missing (still off when all up)
# NB: a light stuck on its last colour / ignoring commands has TWO possible causes:
#   1. WEAK RX LINK (common) — the bridge can't currently reach it. The reconnect loop
#      recovers it on its own once the signal improves; keep a flaky unit within decent
#      range of the adapter (or move the adapter closer).
#   2. FIRMWARE WEDGE (rare; seen on a damaged unit) — the fixture is hung and stays
#      unresponsive EVEN with the adapter touching it. Only a physical power-cycle
#      clears this; better signal does not.
# Distinguish them by whether moving it closer recovers it. See README "Troubleshooting".

[failsafe]
# What lights do when ArtNet data for their universe stops arriving.
#   hold     = keep last state forever (Neewer lights hold their setting)
#   blackout = after timeout, set brightness to 0 (light stays powered/connected)
#   poweroff = after timeout, send BLE power-off
# Timed PER UNIVERSE: only the lights on a universe that went quiet are acted on,
# and only ArtDmx for a universe you actually have lights on counts as signal —
# ArtNet is usually broadcast, so foreign traffic on the wire must not be able to
# hold the failsafe off forever.
# The silence clock starts at bridge startup: booting with the console already
# down triggers the failsafe timeout_secs after start, same as losing it live.
mode         = "hold"
timeout_secs = 0         # 0 = never act (hold); >0 = act after N seconds of silence

[logging]
# Log verbosity + destinations. Console and file are independent — enable either,
# both, or neither. Activity (connects, reconnects, power on/off, failsafe) logs at
# `info`; every BLE command sent to a light logs at `debug`.
# Level precedence: RUST_LOG env var wins outright; otherwise -v/-vv RAISE these
# settings (-v = at least debug, -vv = trace + BLE wire logs) and never lower
# them, so a sink already set to `trace` keeps it.
level         = "info"    # trace | debug | info | warn | error (global default)
console       = true      # log to the console (stderr; stdout stays clean for --json)
# console_level = "info"  # optional per-console override (defaults to `level`)
# file          = "neewer-bridge.log"  # path; omit/empty = no file logging
# file_level    = "debug" # optional per-file override — keep a full debug record
                          # on disk while the console stays at info
max_size_mb   = 10        # rotate the log file once it passes this size (min 1)
max_files     = 5         # how many rotated files to keep, older are deleted (min 1)

# --- Lights -----------------------------------------------------------------
# Easiest: run `neewer-bridge add` (interactive) or `add --mac <MAC> --universe N
# --address N`. It identifies the light's model from its BLE name and fills in
# driver / profile / cct_min / cct_max automatically (see `neewer-bridge models`),
# then appends a complete [[lights]] block to your config.toml.
#
# Or copy the template below into your config.toml by hand (uncomment and edit).
# Add one [[lights]] block per fixture. With no lights configured, the bridge
# still runs and receives ArtNet — it just drives nothing.

# [[lights]]
# mac      = "AA:BB:CC:DD:EE:FF"  # binding identity (required)
# name     = "Key light"          # optional label
# driver   = "auto"               # auto | classic | infinity | home
# profile  = "advanced"           # cct | cct_gm | hsi | rgb | rgbcw | full | advanced | pixel (see README)
#                                 # `rgbcw` (5ch) = direct R,G,B,CW,WW passthrough — maps onto
#                                 #   openHAB's DMX color (3ch) + tunablewhite (2ch) things
#                                 # `advanced` (10ch) = mode-channel: CCT/HSI/FX/RGBCW/XY
#                                 # `pixel` (20ch) = 8-segment colour, 5 animated effects
#                                 # (ColorReplacement/Single/Two/Three-Moving/Fire), TL-series only
# universe = 0                    # ArtNet 15-bit Port-Address (Net/Sub-Net/Universe)
# address  = 1                    # 1-based DMX start channel
# power_on_connect = true         # power the light on at connect. Until the first
#                                 # ArtNet packet arrives it shows a deterministic
#                                 # baseline (CCT 3200K @ 50%); a streaming console
#                                 # overwrites that within its refresh interval.
#                                 # false = hands-off: the bridge sends NOTHING to
#                                 # the light (no power, no colour) until the first
#                                 # ArtNet data for it arrives
# # CCT scaling range, raw x100K (25 = 2500K, 100 = 10000K). Per-model — check the
# # manual. Default 32..56 (3200..5600K); e.g. the TL120C is 25..100 (2500..10000K).
# cct_min  = 32
# cct_max  = 56
# # Advanced-mode frame family (the app's per-model commandType; `add` fills it
# # from the catalog). 2 = Infinity fixtures (TL120C): XY/RGBCW/FX sent as the
# # MAC-embedded frames. 0/1 = direct frames (TL21C). Default 2.
# cmd_type = 2
