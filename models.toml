# GENERATED by scripts/extract_models.py - do not hand-edit the generated rows;
# re-run `python scripts/extract_models.py > models.toml` to regenerate. (You CAN
# add hand-curated [[model]] blocks; fold lasting fixes back into the script.)
#
# AUTHORITATIVE SOURCE: the decompiled NEEWER Studio Android app
# (APK/decompiled/sources/defpackage/nj0.java = DeviceConfigInfo
# table, joined with ck0.getProjectName for names). See protocol-analysis.md.
# Legacy classic panels not in that table (RGB660-era, SNL/SRP, SL80...) are
# supplemented from NeewerLite. Corrected from manuals/hardware where needed
# (the TL120C is verified RGB 2500-10000K).
#
# Capabilities decoded from the Android per-light-type record:
#   supports_rgb  = supportHSI (colour capable)  -> profile "full"
#   supports_gm   = haveGM                          (green/magenta tint)
#   cct_min/max   = min/maxColorTemperature / 100   (raw x100K, 25=2500K)
#   cmd_type      = commandType: 2 = Infinity - advanced modes (XY/RGBCW/FX) need
#                   the MAC-embedded frames (0xB7/0xA9/0x91), hardware-verified on
#                   the TL120C; 0/1 = direct frames (0xB9/0xA8/0x8B), hardware-
#                   verified on the TL21C (FX via direct 0x8B). Drives the driver's
#                   frame-form dispatch.
#   supports_rgbcw/xy/dmx, pixel_classify           (extra modes, for future FX work)
#
# Hardware-verified overrides (see HW_OVERRIDES in the script): TL21C + TL97C
# fx=true (the 18-effect engine renders via the direct 0x8B frame, live-verified
# 2026-07-02 / 2026-07-04). NOTE on GM: visual-only "GM dead" verdicts proved
# unreliable (the shift is subtle) - the TL97C's OLED tracked +/-50 live
# (2026-07-04), so nj0's haveGM values stand; verify via the fixture's display.
#
# driver = classic for all: the bridge connects DIRECTLY over BLE, where the
# classic 0x78 frames (0x81 power / 0x86 HSI / 0x87 CCT) work - verified on the
# TL120C. MAC-embedded "Infinity" frames are only for 2.4G relay through a group
# master, which the bridge does not use. Override per-light if a fixture needs it.
#
# Matching (src/models.rs): product-ID substring wins (newer NW-<id>& names); else
# longest name_matches substring (older NEEWER-<model> names); else add falls back
# to prompts/defaults. List with `neewer-bridge models`.

