[package]
name = "neewer-bridge"
version = "1.9.0"
edition = "2021"
description = "ArtNet (DMX-over-UDP) to Neewer Bluetooth light control bridge"
license = "MIT"
repository = "https://github.com/Fohdeesha/Neewer-Bridge"
# Minimum supported Rust, VERIFIED by building + testing the locked tree on it
# (not inferred). The floor comes from a transitive dependency, not our code:
# `time@0.3.52` (via tracing-subscriber) requires 1.88, while the newest std API
# we use ourselves is `is_multiple_of` (1.87). Declaring it means an old
# toolchain fails with "requires rustc 1.88 or newer" instead of a pile of
# cryptic compile errors — the release workflow uses whatever Rust the GitHub
# runner image ships, so this is the guardrail on that. Re-verify with
# `cargo +<ver> test --locked` if the lockfile is ever regenerated.
rust-version = "1.88"

[[bin]]
name = "neewer-bridge"
path = "src/main.rs"

[lib]
name = "neewer_bridge"
path = "src/lib.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal", "sync", "net", "io-std", "io-util"] }
futures = "0.3"
# Cross-platform BLE (WinRT / BlueZ / CoreBluetooth)
btleplug = "0.11"
uuid = "1"
# CLI + config
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
# Errors + logging (debuggability)
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "chrono"] }
# Non-blocking file logging + size-based rotation (long-lived daemon)
tracing-appender = "0.2"
file-rotate = "0.7"

# Linux/BlueZ only: the stale-device-record recovery (recovery.rs) talks to
# bluetoothd and systemd directly over the system bus. Already in the tree
# through btleplug's BlueZ backend (bluez-async), so no new build requirement.
[target.'cfg(target_os = "linux")'.dependencies]
dbus = "0.9"

[profile.release]
lto = true
strip = true

# The Debian package (`cargo deb`, built and install-tested by the release
# workflow): the binary, a systemd unit that starts it at boot, and
# /etc/neewer-bridge/ for its config. packaging/debian/ holds the unit and the
# maintainer scripts; packaging/test-deb.sh is the install test.
[package.metadata.deb]
maintainer = "Jon Sands <fohdeesha@gmail.com>"
copyright = "2026, Jon Sands"
license-file = ["LICENSE", "0"]
extended-description = """\
Receives ArtNet (DMX over UDP) and drives Neewer lights over their Bluetooth \
LE protocol, each light bound to fixed DMX channels by its MAC address. Runs \
as a systemd service; the config lives in /etc/neewer-bridge/config.toml."""
section = "net"
priority = "optional"
# $auto: the shared libraries the binary links (libc6, libdbus-1-3, ...), with
# the versions the build machine's symbols require — so apt refuses a system
# whose glibc is too old instead of installing a binary that cannot start.
# bluez: every BLE call goes through bluetoothd.
depends = "$auto, bluez"
assets = [
    ["target/release/neewer-bridge", "usr/bin/", "755"],
    # Under /etc, so dpkg treats it as a conffile; the live config.toml beside
    # it is created from it once by postinst and never shipped.
    ["config.example.toml", "etc/neewer-bridge/config.example.toml", "644"],
    ["README.md", "usr/share/doc/neewer-bridge/README.md", "644"],
    ["CHANGELOG.md", "usr/share/doc/neewer-bridge/CHANGELOG.md", "644"],
]
maintainer-scripts = "packaging/debian/"
# Enable at install, start at install, restart (once) after an upgrade — the
# same snippets dh_installsystemd generates. A unit the admin disabled stays
# disabled through upgrades.
systemd-units = { enable = true, start = true, restart-after-upgrade = true }
