[package]
name = "neewer-bridge"
version = "1.1.0"
edition = "2021"
description = "ArtNet (DMX-over-UDP) to Neewer Bluetooth light control bridge"
license = "MIT"

[[bin]]
name = "neewer-bridge"
path = "src/main.rs"

[lib]
name = "neewer_bridge"
path = "src/lib.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal", "sync", "net", "io-std", "io-util"] }
futures = "0.3"
# Cross-platform BLE (WinRT / BlueZ / CoreBluetooth)
btleplug = "0.11"
uuid = "1"
# CLI + config
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
# Errors + logging (debuggability)
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Non-blocking file logging + size-based rotation (long-lived daemon)
tracing-appender = "0.2"
file-rotate = "0.7"

[profile.release]
lto = true
strip = true
