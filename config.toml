# Neewer-Bridge configuration.
#
# This is the live config the bridge reads by default (launching `neewer-bridge`
# with no --config looks for `config.toml` in the working directory; a bare
# `neewer-bridge` with no subcommand runs the bridge). Edit it in place —
# there's nothing to copy or rename. Lights are bound by MAC address, so the
# DMX-channel -> physical-light mapping is identical on every boot regardless of
# power-on or discovery order.

[artnet]
# Local IP to receive ArtNet on. 0.0.0.0 = listen on all interfaces.
bind_ip = "0.0.0.0"
# UDP port to listen on. 6454 is the ArtNet standard; change only if needed.
port = 6454

[ble]
# Which Bluetooth adapter to use. "default" = first adapter. You can also give an
# index ("0", "1", ...) or a substring of the adapter name. Run `neewer-bridge
# adapters` to list what's available on this machine.
adapter    = "default"
flush_hz   = 15          # max BLE state updates per light per second (coalescing cap)
probe_secs = 20          # liveness GATT-probe interval, seconds (stale-session detection)

[failsafe]
# What lights do when ArtNet data stops arriving.
#   hold     = keep last state forever (Neewer lights hold their setting)
#   blackout = after timeout, set brightness to 0 (light stays powered/connected)
#   poweroff = after timeout, send BLE power-off
mode         = "hold"
timeout_secs = 0         # 0 = never act (hold); >0 = act after N seconds of silence

[logging]
# Log verbosity + destinations. Console and file are independent — enable either,
# both, or neither. Activity (connects, reconnects, power on/off, failsafe) logs at
# `info`; every BLE command sent to a light logs at `debug`.
# Level precedence: RUST_LOG env var > -v/-vv CLI flags > these settings.
level         = "info"    # trace | debug | info | warn | error (global default)
console       = true      # log to the console (stderr; stdout stays clean for --json)
# console_level = "info"  # optional per-console override (defaults to `level`)
# file          = "neewer-bridge.log"  # path; omit/empty = no file logging
# file_level    = "debug" # optional per-file override — keep a full debug record
                          # on disk while the console stays at info
max_size_mb   = 10        # rotate the log file once it passes this size
max_files     = 5         # how many rotated files to keep (older are deleted)

# --- Lights -----------------------------------------------------------------
# Easiest: run `neewer-bridge add` (interactive) or `add --mac <MAC> --universe N
# --address N`. It identifies the light's model from its BLE name and fills in
# driver / profile / cct_min / cct_max automatically (see `neewer-bridge models`),
# then appends a complete [[lights]] block here.
#
# Or fill in the template below by hand (uncomment and edit). Add one [[lights]]
# block per fixture. With no lights configured, the bridge still runs and receives
# ArtNet — it just drives nothing.

# [[lights]]
# mac      = "AA:BB:CC:DD:EE:FF"  # binding identity (required)
# name     = "Key light"          # optional label
# driver   = "auto"               # auto | classic | infinity | home
# profile  = "advanced"           # cct | cct_gm | hsi | rgb | rgbcw | full | advanced | pixel (NOTES.md §8.1)
#                                 # `rgb` (3ch) = plain R,G,B converted to HSI — works on EVERY
#                                 #   colour light (one openHAB 3ch color thing, no rules)
#                                 # `rgbcw` (5ch) = direct R,G,B,CW,WW passthrough — maps onto
#                                 #   openHAB's DMX color (3ch) + tunablewhite (2ch) things
#                                 # `advanced` (10ch) = mode-channel: CCT/HSI/FX/RGBCW/XY
#                                 # `pixel` (20ch) = 8-segment colour, 5 animated effects
#                                 # (ColorReplacement/Single/Two/Three-Moving/Fire), TL-series only
# universe = 0                    # ArtNet 15-bit Port-Address (Net/Sub-Net/Universe)
# address  = 1                    # 1-based DMX start channel
# power_on_connect = true
# # CCT scaling range, raw x100K (25 = 2500K, 100 = 10000K). Per-model — check the
# # manual. Default 32..56 (3200..5600K); e.g. the TL120C is 25..100 (2500..10000K).
# cct_min  = 32
# cct_max  = 56
# # Advanced-mode frame family (the app's per-model commandType; `add` fills it
# # from the catalog). 2 = Infinity fixtures (TL120C): XY/RGBCW/FX sent as the
# # MAC-embedded frames. 0/1 = direct frames (TL21C). Default 2.
# cmd_type = 2

# TL120C driven as a native RGBCW fixture from openHAB (color + tunablewhite things).
# DMX: ch1=R ch2=G ch3=B ch4=CW ch5=WW at universe 0, start address 1.
[[lights]]
mac      = "D6:50:F2:F6:BB:1B"
name     = "TL120C"
driver   = "classic"
profile  = "rgbcw"
universe = 0
address  = 1
power_on_connect = true
cct_min  = 25
cct_max  = 100
cmd_type = 2

[[lights]]
mac = "CB:33:5A:EE:5A:7C"
name = "TL120C"
driver = "classic"
profile = "advanced"
universe = 0
address = 6
power_on_connect = true
cct_min = 25
cct_max = 100
cmd_type = 2

# TL21C (HW-tested 2026-07-02): CCT 2500-8500K + HSI + FX (direct 0x8B via
# cmd_type=1). No XY/RGBCW/pixel, and GM is ignored by the hardware — the
# advanced profile's XY/RGBCW bands and the CCT band's GM channel are inert.
[[lights]]
mac = "FA:F8:A9:B9:41:1C"
name = "TL21C"
driver = "classic"
profile = "advanced"
universe = 0
address = 16
power_on_connect = true
cct_min = 25
cct_max = 85
cmd_type = 1

# TL60 RGB (unit "RGB-3" revision, fw 3.0.5; HW-tested 2026-07-03): CCT 2500-10000K
# + GM (works over BLE — first fixture confirmed!) + HSI + RGBCW (by-MAC 0xA9, incl.
# CW/WW banks) + FX (both 0x91 MAC and direct 0x8B render) + pixel effects 1/3/4/5/7
# (same 5 as the TL120C; it's a 7-effect classify-1 model). No XY — that advanced-
# profile band is inert. `pixel` profile also works if preferred.
[[lights]]
mac = "F9:B8:B6:15:F9:8D"
name = "TL60"
driver = "classic"
profile = "advanced"
universe = 0
address = 26
power_on_connect = true
cct_min = 25
cct_max = 100
cmd_type = 2

# TL97C (HW-tested 2026-07-04): CCT 2500-8500K + GM (works — subtle render, the
# OLED tracks it) + HSI + FX (direct 0x8B via cmd_type=1; MAC 0x91 ignored) — a
# TL21C capability twin. No XY/RGBCW/pixel (all ignored), and NO status-read
# replies (not even battery). `rgb` = 3ch R,G,B -> HSI for openHAB; switch to
# `advanced` if CCT/GM/FX are ever wanted over DMX.
[[lights]]
mac = "F2:43:CF:E2:23:D2"
name = "TL97C"
driver = "classic"
profile = "rgb"
universe = 0
address = 36
power_on_connect = true
cct_min = 25
cct_max = 85
cmd_type = 1
